[tools]
gh = "2.98.0"
jq = "1.8.2"
java = "temurin-21.0.12+101.0.LTS"
node = "26.7.0"
pnpm = "11.22.0"
rust = "1.97.1"
xcodegen = "2.46.0"
"cargo:wasm-bindgen-cli" = "0.2.127"

[tasks."build:session-wasm"]
description = "Build and bind the shared ReaderSession WASM module"
run = "bash scripts/build-session-wasm.sh"

[tasks."build:session-licenses"]
description = "Generate notices for the locked ReaderSession WASM dependencies"
run = "node scripts/build-session-licenses.mjs"

[tasks."spec:check"]
description = "Type-check the finite ReaderSession Quint model"
run = "pnpm exec quint typecheck packages/session/spec/reader_session.qnt"

[tasks."spec:test"]
description = "Run ReaderSession named Quint tests"
run = "pnpm exec quint test packages/session/spec/reader_session.qnt --match '^(closeThenLateTick|closeThenLatePreparationSuccess|newRequestSupersedesOldRequest|newRequestRejectsLatePreparationFailure|playUntilFigureAndResume|consecutiveFiguresAndResume|duplicateFigureTickDoesNotConsume|previousSentenceWhilePlaying|previousSentenceFromPaused|previousSentenceFromFigure|pausedTickDoesNotAdvance|staleGenerationTickDoesNotAdvance|cancelThenLatePreparationSuccess|switchModeAtFigure|switchModeAfterFigure|pausedModeRoundTrip|rebuildSpotsWhilePlaying|visibilityHiddenPauses|visibilityHiddenDuringPreparation|visibilityHiddenDuringPreparationThenFailure|visibilityHiddenDuringPreparationIsIdempotent)$' --seed=180018 --max-samples=1"

[tasks."spec:simulate"]
description = "Run the fixed-seed ReaderSession Quint simulation"
depends = ["spec:check"]
run = "pnpm exec quint run packages/session/spec/reader_session.qnt --max-steps=12 --max-samples=1000 --seed=180018 --invariants endedHasNoContent playingOnlyInSpots figureIsPaused timerOnlyWhilePlaying positionIsInRange staleTickDoesNotAdvance stalePreparationDoesNotOpen hiddenPreparationStartsPaused repeatedPreparationVisibilityIsStable closedSessionCannotRevive noImplicitRewind figureConsumedAtMostOnce modeRoundTripKeepsLocation"

[tasks."spec:verify"]
description = "Fully verify the finite ReaderSession model with TLC"
depends = ["spec:check"]
run = "pnpm exec quint verify packages/session/spec/reader_session.qnt --backend=tlc --verbosity=3 --invariants endedHasNoContent playingOnlyInSpots figureIsPaused timerOnlyWhilePlaying positionIsInRange staleTickDoesNotAdvance stalePreparationDoesNotOpen hiddenPreparationStartsPaused repeatedPreparationVisibilityIsStable closedSessionCannotRevive noImplicitRewind figureConsumedAtMostOnce modeRoundTripKeepsLocation"

[tasks."test:session"]
description = "Run the ReaderSession Rust and Quint Connect tests"
run = [
  "cargo fmt --check",
  "RUST_TEST_THREADS=1 PATH=\"$PWD/node_modules/.bin:$PATH\" cargo test --locked --package reader-session",
  "pnpm exec quint --version | grep -F '0.32.0'",
  "mise run spec:test",
  "mise run spec:simulate",
  "mise run spec:verify",
]

[tasks."measure:session"]
description = "Measure the ReaderSession WASM artifact"
depends = ["build:session-wasm"]
run = "node scripts/measure-session-wasm.mjs"

[tasks.compile]
description = "Compile the TypeScript sources"
run = "pnpm exec tsc -p tsconfig.json"

[tasks.typecheck]
description = "Type-check the TypeScript sources and tests"
run = [
  "pnpm exec tsc -p tsconfig.json --noEmit",
  "pnpm exec tsc -p tsconfig.tests.json",
]

[tasks."build:browser-runtime"]
description = "Bundle the shared browser runtime for Chrome and Safari"
run = "node scripts/build-browser-runtime.mjs"

[tasks."build:chrome"]
description = "Build the Chrome extension"
depends = ["compile", "build:browser-runtime", "build:session-wasm", "build:session-licenses"]
run = '''
rm -rf apps/chrome/dist
install -d apps/chrome/dist/vendor/defuddle apps/chrome/dist/LICENSES
cp apps/chrome/manifest.json apps/chrome/dist/manifest.json
cp .build/browser-runtime/service-worker.js apps/chrome/dist/service-worker.js
cp .build/browser-runtime/chrome.js apps/chrome/dist/runtime.js
cp .build/browser-runtime/session-host.js apps/chrome/dist/session-host.js
cp .build/browser-runtime/session-worker.js apps/chrome/dist/session-worker.js
cp apps/chrome/session-host.html apps/chrome/dist/session-host.html
cp .build/session-wasm/reader_session.js apps/chrome/dist/session-wasm.js
cp .build/session-wasm/reader_session_bg.wasm apps/chrome/dist/reader_session_bg.wasm
cp node_modules/defuddle/dist/index.js apps/chrome/dist/vendor/defuddle/defuddle.js
cp node_modules/defuddle/LICENSE apps/chrome/dist/vendor/defuddle/LICENSE
cp LICENSES/lucide.txt apps/chrome/dist/LICENSES/lucide.txt
cp .build/session-licenses/reader-session-dependencies.txt apps/chrome/dist/LICENSES/reader-session-dependencies.txt
'''

[tasks."package:chrome"]
description = "Package the Chrome extension"
depends = ["build:chrome"]
run = '''
version="$(jq -er '.version | select(test("^[0-9]{4}\\.([1-9]|1[0-2])\\.(0|[1-9][0-9]*)$"))' apps/chrome/manifest.json)"
archive_name="reader-chrome-${version}.zip"
archive_path="$PWD/artifacts/chrome/$archive_name"
rm -rf artifacts/chrome
install -d artifacts/chrome
(cd apps/chrome/dist && zip -X -q -r "$archive_path" .)
(cd artifacts/chrome && shasum -a 256 "$archive_name" > SHA256SUMS)
'''

[tasks."bump:chrome"]
description = "Set the next monthly Chrome CalVer"
run = '''
git fetch origin --tags
version="$(bash scripts/next-chrome-version.sh)"
node -e '
const fs = require("node:fs");
const manifestPath = "apps/chrome/manifest.json";
const manifest = fs.readFileSync(manifestPath, "utf8");
const versionFields = manifest.match(/^\s*"version":\s*"[^"]+",?$/gm) || [];
if (versionFields.length !== 1) throw new Error("expected one Chrome manifest version");
fs.writeFileSync(manifestPath, manifest.replace(/^(\s*"version":\s*")[^"]+(".*)$/m, `$1${process.argv[1]}$2`));
' "$version"
printf 'Chrome version: %s\n' "$version"
'''

[tasks."verify:chrome-release"]
description = "Verify the Chrome release tag and package"
depends = ["package:chrome"]
run = '''
version="$(jq -er '.version | select(test("^[0-9]{4}\\.([1-9]|1[0-2])\\.(0|[1-9][0-9]*)$"))' apps/chrome/manifest.json)"
expected_tag="chrome-v${version}"
release_tag="${RELEASE_TAG:-$expected_tag}"
test "$release_tag" = "$expected_tag"
test -f "artifacts/chrome/reader-chrome-${version}.zip"
test -f artifacts/chrome/SHA256SUMS
(cd artifacts/chrome && shasum -a 256 -c SHA256SUMS)
'''

[tasks."build:ios"]
description = "Build the Safari extension resources"
depends = ["compile", "build:browser-runtime", "build:session-wasm", "build:session-licenses"]
run = '''
rm -rf apps/ios/ReaderExtension/Resources/generated
install -d apps/ios/ReaderExtension/Resources/generated
cp node_modules/defuddle/dist/index.js apps/ios/ReaderExtension/Resources/generated/defuddle.js
cp .build/browser-runtime/safari.js apps/ios/ReaderExtension/Resources/generated/runtime.js
cp .build/session-wasm/reader_session.js apps/ios/ReaderExtension/Resources/generated/session-wasm.js
cp .build/session-wasm/reader_session_bg.wasm apps/ios/ReaderExtension/Resources/generated/reader_session_bg.wasm
cp .build/browser-runtime/safari-bootstrap.js apps/ios/ReaderExtension/Resources/generated/bootstrap.js
cp node_modules/defuddle/LICENSE apps/ios/ReaderExtension/Resources/generated/defuddle-LICENSE.txt
cp LICENSES/lucide.txt apps/ios/ReaderExtension/Resources/generated/lucide-LICENSE.txt
cp .build/session-licenses/reader-session-dependencies.txt apps/ios/ReaderExtension/Resources/generated/reader-session-dependencies.txt
'''

[tasks."generate:ios-project"]
description = "Generate the shared Xcode project from project.yml"
run = "xcodegen generate --spec apps/ios/project.yml"

[tasks."verify:ios-project"]
description = "Verify the shared Xcode project matches project.yml"
run = '''
mise run generate:ios-project
if ! git diff --quiet -- apps/ios/reader.xcodeproj; then
  printf 'apps/ios/reader.xcodeproj is not generated from apps/ios/project.yml\n' >&2
  git diff -- apps/ios/reader.xcodeproj >&2
  exit 1
fi
'''

[tasks."bump:ios-build"]
description = "Increment the personal iOS build and regenerate the Xcode project"
run = '''
build="$(node scripts/bump-ios-build.mjs)"
mise run generate:ios-project
printf 'iOS build: %s\n' "$build"
'''

[tasks.build]
description = "Build the Chrome and Safari extensions"
run = [{ tasks = ["build:chrome", "build:ios"] }]

[tasks."measure:bundle"]
description = "Record extension bundle sizes as JSON"
depends = ["build"]
run = "node benchmark/bundle.mjs"

[tasks."measure:performance"]
description = "Record the full browser extraction and startup benchmark"
depends = ["build"]
run = "node benchmark/full-browser.mjs"

[tasks."benchmark:fast"]
description = "Run the short paired Node benchmark gate"
depends = ["compile"]
run = [
  "node_modules/.bin/vitest bench benchmark/fast.bench.ts --outputJson test-results/performance/fast-vitest.json --maxWorkers=1 --no-file-parallelism",
  "node benchmark/check-fast.mjs",
]

[tasks."benchmark:full"]
description = "Run the full browser benchmark and retain its report"
depends = ["build"]
run = "node benchmark/full-browser.mjs"

[tasks."measure:timing"]
description = "Generate the Reader timing corpus report"
depends = ["compile"]
run = "node --experimental-strip-types scripts/report-reader-timing.mjs"

[tasks.check]
description = "Run static checks"
run = [
  { task = "typecheck" },
  { task = "spec:check" },
  "cargo fmt --check",
]

[tasks."test:node"]
description = "Run TypeScript tests without generated Rust/WASM or packaged extension artifacts"
depends = ["compile", "build:browser-runtime"]
run = "pnpm exec vitest run --exclude apps/chrome/tests/build.test.ts --exclude apps/ios/tests/extension.test.ts --exclude packages/session/browser/tests/session.real.test.ts"

[tasks.test]
description = "Build and test reader"
depends = ["build", "test:session"]
run = "pnpm exec vitest run"

[tasks."test:e2e"]
description = "Run the real-browser viewer tests"
depends = ["build"]
run = "pnpm exec playwright test"

[tasks."test:chrome-extension"]
description = "Run the generated Chrome MV3 extension in a real Chromium context"
depends = ["build:chrome"]
run = "node scripts/test-chrome-extension-smoke.mjs"

[tasks."test:safari-package-runtime"]
description = "Verify generated Safari resources and optional Safari WebDriver runtime"
depends = ["build:ios"]
run = "node scripts/test-safari-package-runtime.mjs"

[tasks."release:chrome"]
description = "Release the current Chrome version"
run = '''
test "$(git branch --show-current)" = "main"
test -z "$(git status --porcelain)"
git fetch origin main --tags
test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
version="$(jq -er '.version' apps/chrome/manifest.json)"
next_version="$(bash scripts/next-chrome-version.sh)"
if [[ "$version" != "$next_version" ]]; then
  printf 'Chrome version must be %s, got %s\n' "$next_version" "$version" >&2
  exit 1
fi
tag="chrome-v${version}"
if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
  echo "$tag already exists" >&2
  exit 1
fi
mise run check
mise run test
mise run verify:chrome-release
git tag -a "$tag" -m "reader Chrome ${version}"
git push origin "$tag"
'''
