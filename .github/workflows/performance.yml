name: Full reader performance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-reader-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  browser:
    name: Full browser benchmark (${{ matrix.fixture-group }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        fixture-group:
          - short-article
          - long-article
          - large-dom
          - heap
          - passive
    env:
      READER_PERFORMANCE_RUNS: 10
      READER_PERFORMANCE_ENFORCE: 1
      READER_PERFORMANCE_GROUP: ${{ matrix.fixture-group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm
          cache: false
      - name: Install Rust session toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.97.1
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Build extension for the selected fixture group
        run: mise run build
      - name: Build main paired baseline
        run: |
          git fetch --no-tags --depth=1 origin main
          baseline_dir="$RUNNER_TEMP/reader-main-full-performance"
          git worktree add --detach "$baseline_dir" FETCH_HEAD
          (cd "$baseline_dir" && pnpm install --frozen-lockfile --ignore-scripts)
          (cd "$baseline_dir" && rustup override set 1.97.1)
          mise trust "$baseline_dir/mise.toml"
          (cd "$baseline_dir" && mise run build)
          echo "READER_PERFORMANCE_BASELINE_ROOT=$baseline_dir" >> "$GITHUB_ENV"
          echo "READER_PERFORMANCE_BASE_COMMIT=$(git -C "$baseline_dir" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "READER_PERFORMANCE_CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run full browser benchmark
        run: node benchmark/full-browser.mjs
      - name: Remove main benchmark baseline
        if: always()
        run: if [ -d "$RUNNER_TEMP/reader-main-full-performance" ]; then git worktree remove --force "$RUNNER_TEMP/reader-main-full-performance"; fi
      - name: Upload full benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-performance-${{ matrix.fixture-group }}
          path: test-results/performance/
          if-no-files-found: warn
