name: Chrome release

on:
  push:
    tags:
      - chrome-v*

permissions:
  contents: read

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: gh jq node pnpm rust java cargo:wasm-bindgen-cli
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check
        run: mise run check
      - name: Test
        run: mise run test
      - name: Measure session runtime
        run: mise run measure:session
      - name: Verify release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run verify:chrome-release
      - name: Generate release notes
        run: bash scripts/generate-chrome-release-notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/chrome-release-notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -er '.version' apps/chrome/manifest.json)"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/chrome/reader-chrome-${version}.zip" \
            artifacts/chrome/SHA256SUMS \
            --verify-tag \
            --title "reader Chrome ${version}" \
            --notes-file "$RUNNER_TEMP/chrome-release-notes.md"
