name: Apple release

on:
  push:
    tags:
      - apple-v*

permissions:
  contents: read

jobs:
  release:
    name: Snapshot and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: gh jq node
          cache: false
      - name: Verify source snapshot
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run verify:apple-release
      - name: Generate release notes
        env:
          APPLE_RELEASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/generate-apple-release-notes.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/apple-release-notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/sync-release-version.mjs --check)"
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/apple/reader-apple-${version}-source.tar.gz" \
            artifacts/apple/SHA256SUMS \
            --verify-tag \
            --title "reader Apple ${version}" \
            --notes-file "$RUNNER_TEMP/apple-release-notes.md"
