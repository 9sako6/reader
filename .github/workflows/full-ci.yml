name: Full session and artifact CI

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Full TypeScript, session, and artifact tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm rust java cargo:wasm-bindgen-cli
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check
        run: mise run check
      - name: Test
        run: mise run test
      - name: Verify session model and measure WASM
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          mise run spec:verify
          mise run measure:session
      - name: Measure extension bundles
        run: mise run measure:bundle
      - name: Upload bundle baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-bundle-baseline
          path: test-results/performance/bundle.json
          if-no-files-found: error
