name: Platform E2E and iOS

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Chromium viewer E2E
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm rust cargo:wasm-bindgen-cli
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Run Chromium E2E
        run: mise run test:e2e -- --project=chromium
      - name: Run generated Chrome extension smoke
        run: mise run test:chrome-extension
      - name: Upload Chromium reader timing reports
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-reader-timing
          path: test-results/timing/*.json
          if-no-files-found: error
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  ios:
    name: iOS build and WebKit viewer E2E
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm rust xcodegen cargo:wasm-bindgen-cli
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install WebKit
        run: pnpm exec playwright install webkit
      - name: Run generated viewer E2E in WebKit
        run: mise run test:e2e -- --project=webkit
      - name: Upload WebKit reader timing reports
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-reader-timing
          path: test-results/timing/*.json
          if-no-files-found: error
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project apps/ios/reader.xcodeproj
          -scheme reader
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify generated Safari package runtime
        run: READER_REQUIRE_IOS_EXTENSION_BUNDLE=1 mise run test:safari-package-runtime
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
