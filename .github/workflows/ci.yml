name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: TypeScript and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm
          cache: false
      - name: Install Rust session toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup override set 1.97.1
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openjdk-21-jre-headless
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check
        run: mise run check
      - name: Test
        run: mise run test
      - name: Verify session model and measure WASM
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          mise run spec:verify
          mise run measure:session
      - name: Measure extension bundles
        run: mise run measure:bundle
      - name: Upload bundle baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-bundle-baseline
          path: test-results/performance/bundle.json
          if-no-files-found: error

  e2e:
    name: Chromium viewer E2E
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm
          cache: false
      - name: Install Rust session toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.97.1
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Measure reader performance
        run: mise run measure:performance
      - name: Upload reader performance baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-performance-baseline
          path: test-results/performance/reader.json
          if-no-files-found: error
      - name: Run Chromium E2E
        run: mise run test:e2e -- --project=chromium
      - name: Run generated Chrome extension smoke
        run: mise run test:chrome-extension
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  ios:
    name: iOS build and WebKit viewer E2E
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm xcodegen
          cache: false
      - name: Install Rust session toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.97.1
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install WebKit
        run: pnpm exec playwright install webkit
      - name: Run generated viewer E2E in WebKit
        run: mise run test:e2e -- --project=webkit
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project apps/ios/reader.xcodeproj
          -scheme reader
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
