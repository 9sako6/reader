name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: TypeScript and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm
          cache: false
      - name: Install Rust session toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup override set 1.97.1
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openjdk-21-jre-headless
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check
        run: mise run check
      - name: Test
        run: mise run test
      - name: Verify session model and measure WASM
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          mise run spec:verify
          mise run measure:session
      - name: Measure extension bundles
        run: mise run measure:bundle
      - name: Upload bundle baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-bundle-baseline
          path: test-results/performance/bundle.json
          if-no-files-found: error

  performance:
    name: Fast paired benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: node pnpm
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch and compile main benchmark implementation
        run: |
          pnpm exec tsc -p tsconfig.json
          baseline_dir="$RUNNER_TEMP/reader-main-benchmark"
          candidate_commit="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin main
            baseline_commit="$(git rev-parse FETCH_HEAD)"
          else
            baseline_commit="$(git rev-list --first-parent --max-count=2 "$candidate_commit" | sed -n '2p')"
          fi
          test -n "$baseline_commit"
          test "$baseline_commit" != "$candidate_commit"
          git cat-file -e "$baseline_commit^{commit}"
          git worktree add --detach "$baseline_dir" "$baseline_commit"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          (cd "$baseline_dir" && pnpm exec tsc -p tsconfig.json)
          echo "READER_BENCHMARK_BASELINE_ROOT=$baseline_dir" >> "$GITHUB_ENV"
          echo "READER_BENCHMARK_CANDIDATE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "READER_BENCHMARK_BASELINE_COMMIT=$baseline_commit" >> "$GITHUB_ENV"
          echo "READER_BENCHMARK_CANDIDATE_COMMIT=$candidate_commit" >> "$GITHUB_ENV"
      - name: Run paired Node benchmark
        run: |
          node_modules/.bin/vitest bench benchmark/fast.bench.ts \
            --outputJson test-results/performance/fast-vitest.json \
            --maxWorkers=1 \
            --no-file-parallelism
      - name: Enforce paired budget
        run: node benchmark/check-fast.mjs
      - name: Remove main benchmark worktree
        if: always()
        run: if [ -d "$RUNNER_TEMP/reader-main-benchmark" ]; then git worktree remove --force "$RUNNER_TEMP/reader-main-benchmark"; fi
