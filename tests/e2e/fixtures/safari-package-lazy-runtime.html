<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safari lazy package runtime</title>
    <script>
      globalThis.browser = {
        runtime: {
          getURL(path) {
            const params = new URLSearchParams(location.search);
            const assetRoot = params.get("asset-root") === "baseline"
              ? "/__reader-baseline__/apps/ios/ReaderExtension/Resources/generated"
              : "/apps/ios/ReaderExtension/Resources/generated";
            const query = new URLSearchParams();
            if (params.has("slow")) query.set("delay", "250");
            if (params.has("boundary")) query.set("delay", "600");
            if (params.has("slow-extraction")) query.set("slow-extraction", "900");
            if (params.has("retry")) {
              query.set("fail-once", "runtime.js");
              query.set("token", params.get("runtime") || "retry");
            }
            const suffix = query.toString() ? `?${query}` : "";
            return `${assetRoot}/${path}${suffix}`;
          },
        },
      };
    </script>
    <script>
      if (!new URLSearchParams(location.search).has("passive-control")) {
        const bootstrap = document.createElement("script");
        const assetRoot = new URLSearchParams(location.search).get("asset-root") === "baseline"
          ? "/__reader-baseline__/apps/ios/ReaderExtension/Resources/generated"
          : "/apps/ios/ReaderExtension/Resources/generated";
        bootstrap.src = `${assetRoot}/bootstrap.js`;
        document.head.append(bootstrap);
      }
    </script>
  </head>
  <body>
    <article>
      <h1>Safariの遅延生成パッケージを検証します</h1>
      <p>tap後にReaderSessionと最初のunitが準備されます。</p>
    </article>
  </body>
</html>
