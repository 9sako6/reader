<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safari lazy package runtime</title>
    <script>
      globalThis.browser = {
        runtime: {
          getURL(path) {
            const query = new URLSearchParams(location.search).has("slow") ? "?delay=250" : "";
            return `/apps/ios/ReaderExtension/Resources/generated/${path}${query}`;
          },
        },
      };
    </script>
    <script src="/apps/ios/ReaderExtension/Resources/generated/bootstrap.js"></script>
  </head>
  <body>
    <article>
      <h1>Safariの遅延生成パッケージを検証します</h1>
      <p>tap後にReaderSessionと最初のunitが準備されます。</p>
    </article>
  </body>
</html>
