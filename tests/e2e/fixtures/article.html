<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>実ブラウザ検証用の記事</title>
    <style>
      * { box-sizing: content-box !important; }
      button { min-width: 180px !important; min-height: 12px !important; background: rgb(255, 0, 128) !important; color: rgb(0, 64, 0) !important; }
      img { width: 12px !important; height: 12px !important; }
      body { margin: 0; color: #202020; font-family: serif; }
      article { width: min(42rem, calc(100% - 40px)); margin: 80px auto; font-size: 18px; line-height: 1.8; }
      #launch-chrome { margin: 20px; }
    </style>
  </head>
  <body>
    <button id="launch-chrome" type="button">Chrome readerを開く</button>
    <article>
      <h1>実ブラウザで読む</h1>
      <p>最初の短い文です。次の文は注視位置が動かないことを確かめます。</p>
      <h2>画像のある節</h2>
      <p>画像の直前にある文です。</p>
      <figure>
        <img src="/apps/ios/tests/fixtures/reading-flow.svg" alt="本文の読書フロー図" style="width: 600px !important; height: auto !important">
        <figcaption>読書フローの図</figcaption>
      </figure>
      <blockquote>引用も本文として読み取ります。</blockquote>
      <p>画像の後に続く文章です。最後まで操作できます。</p>
    </article>
    <script>
      const parameters = new URLSearchParams(location.search);
      const viewer = parameters.get("viewer") || "chrome";
      const wasmFailure = parameters.get("wasm") === "fail";
      globalThis.__READER_WASM_FAILURE = wasmFailure;
      globalThis.__READER_WASM_RETRY = false;
      const pageHost = parameters.get("pageHost") === "true";
      const imageFixture = parameters.get("image") || "default";
      const figureFirst = parameters.get("figure") === "first";
      const configuredDelay = Number(parameters.get("delay"));
      const defaultDelay = Number.isFinite(configuredDelay) && configuredDelay >= 0 ? configuredDelay : 0;
      const loadedScripts = [];

      if (pageHost) {
        const pageOwnedHost = document.createElement("div");
        pageOwnedHost.id = "__reader-host";
        pageOwnedHost.textContent = "ページ側の要素";
        document.body.prepend(pageOwnedHost);
      }

      function loadScript(source, type = "text/javascript") {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = source;
          script.type = type;
          script.onload = resolve;
          script.onerror = reject;
          document.head.append(script);
        });
      }

      function fixtureContent(options = {}) {
        const leading = options.figureFirst
          ? ""
          : "最初の短い文です。次の文は注視位置が動かないことを確かめます。画像の直前にある文です。";
        const caption = options.figureFirst ? "先頭画像" : "読書フローの図";
        const configuredCaption = typeof options.caption === "string" ? options.caption : caption;
        const trailing = options.figureFirst
          ? "画像の直後から本文を続けます。"
          : "画像の後に続く文章です。最後まで操作できます。";
        const figureOffset = leading.length + (leading ? 1 : 0);
        const trailingOffset = figureOffset + configuredCaption.length + 1;
        const text = leading ? `${leading}\n${configuredCaption}\n${trailing}` : `${configuredCaption}\n${trailing}`;
        const outline = options.outline === "two";
        const configuredImage = typeof options.image === "string" ? options.image : imageFixture;
        const configuredAlt = typeof options.alt === "string" ? options.alt : "本文の読書フロー図";
        const imagePath = configuredImage === "default"
          ? "/apps/ios/tests/fixtures/reading-flow.svg"
          : configuredImage === "delayed" && typeof options.cacheKey === "string" && options.cacheKey
            ? `/image/delayed/${encodeURIComponent(options.cacheKey)}.png`
            : `/image/${configuredImage}.png`;
        const imageUrl = new URL(imagePath, location.href);
        if (typeof options.cacheKey === "string" && options.cacheKey) imageUrl.searchParams.set("case", options.cacheKey);
        if (typeof options.imageDelay === "number" && Number.isFinite(options.imageDelay) && options.imageDelay >= 0) {
          imageUrl.searchParams.set("delay", String(options.imageDelay));
        }
        const imageDimensions = {
          vertical: { width: 240, height: 1200 },
          horizontal: { width: 1200, height: 240 },
          transparent: { width: 640, height: 480 },
          huge: { width: 4000, height: 3000 },
        }[configuredImage];
        return {
          text,
          readingContext: {
            language: "ja",
            title: "実ブラウザで読む",
            blocks: [
              ...(leading ? [{ text: leading, kind: "paragraph", level: null, start: 0, end: leading.length }] : []),
              { text: trailing, kind: "paragraph", level: null, start: trailingOffset, end: text.length },
            ],
            headings: outline
              ? [{ text: "実ブラウザで読む", level: 1 }, { text: "画像のある節", level: 2 }]
              : [{ text: "実ブラウザで読む", level: 1 }],
            sectionOffsets: [],
            sectionTransitions: outline
              ? [{ offset: 0, headingIndex: 0 }, { offset: trailingOffset, headingIndex: 1 }]
              : [],
            initialHeadingIndex: 0,
            figures: [{
              src: imageUrl.href,
              ...(imageDimensions || {}),
              alt: configuredAlt,
              caption: configuredCaption,
              sourceOffset: figureOffset,
              sourceEnd: figureOffset + configuredCaption.length,
              ...(typeof options.srcset === "string" ? { srcset: options.srcset } : {}),
              ...(typeof options.sizes === "string" ? { sizes: options.sizes } : {}),
            }],
          },
        };
      }

      function customFixtureContent(text, suppliedReadingContext = {}) {
        return {
          text,
          readingContext: {
            language: "ja",
            headings: [],
            sectionOffsets: [],
            sectionTransitions: [],
            initialHeadingIndex: -1,
            figures: [],
            ...suppliedReadingContext,
          },
        };
      }

      function readerHost() {
        return document.querySelector('[data-reader-owned="true"]');
      }

      async function installChromeViewer() {
        const messageListeners = [];
        const loadingBarRevealEvents = [];
        const cancelledRequestIds = new Set();
        let requestSequence = 0;
        const chromeGlobal = globalThis.chrome || {};
        chromeGlobal.runtime = {
          getURL(path) {
            if (globalThis.__READER_WASM_FAILURE && !globalThis.__READER_WASM_RETRY && path.endsWith(".wasm")) {
              return "/missing/reader_session_bg.wasm";
            }
            return `/apps/chrome/dist/${path}`;
          },
          onMessage: {
            addListener(listener) {
              messageListeners.push(listener);
            },
          },
          sendMessage(message) {
            if (message?.type === "CANCEL_RSVP" && typeof message.requestId === "string") {
              cancelledRequestIds.add(message.requestId);
            }
            if (message?.type === "RETRY_RSVP" && typeof message.requestId === "string") {
              open({ delay: 0, text: "再試行成功。" });
            }
            return Promise.resolve();
          },
        };
        globalThis.chrome = chromeGlobal;
        for (const source of [
          "/apps/chrome/dist/vendor/defuddle/defuddle.js",
          "/apps/chrome/dist/session-wasm.js",
          "/apps/chrome/dist/session.js",
          "/apps/chrome/dist/engine.js",
          "/apps/chrome/dist/extractor.js",
          "/apps/chrome/dist/icons.js",
          "/apps/chrome/dist/viewer.js",
        ]) {
          await loadScript(source);
          loadedScripts.push(source);
        }
        const open = (customTextOrOptions) => {
          const options = typeof customTextOrOptions === "object" && customTextOrOptions !== null
            ? customTextOrOptions
            : {};
          const customText = typeof customTextOrOptions === "string"
            ? customTextOrOptions
            : options.text;
          const { text, readingContext } = typeof customText === "string"
            ? customFixtureContent(customText, options.readingContext)
            : fixtureContent({
              image: options.image || imageFixture,
              figureFirst: options.figureFirst || figureFirst,
              outline: options.outline,
              alt: options.alt,
              caption: options.caption,
              cacheKey: options.cacheKey,
              srcset: options.srcset,
              sizes: options.sizes,
              imageDelay: options.imageDelay,
            });
          const requestId = typeof options.requestId === "string"
            ? options.requestId
            : `e2e-${requestSequence += 1}`;
          const requestedDelay = Number(options.delay);
          const delay = Number.isFinite(requestedDelay) && requestedDelay >= 0 ? requestedDelay : defaultDelay;
          const shouldFail = options.error === true;
          for (const listener of messageListeners) listener({ type: "SHOW_RSVP_LOADING", requestId });
          const start = () => {
            if (cancelledRequestIds.has(requestId)) return;
            if (shouldFail) {
              for (const listener of messageListeners) {
                listener({ type: "RSVP_ERROR", requestId, reason: options.reason || "extraction_failed" });
              }
              return;
            }
            for (const listener of messageListeners) listener({ type: "START_RSVP", requestId, text, readingContext });
            if (options.paused === true) {
              const pauseWhenReady = () => {
                const host = readerHost();
                const pauseButton = host?.shadowRoot?.querySelector('[aria-label="一時停止"]');
                if (pauseButton) pauseButton.click();
                else setTimeout(pauseWhenReady, 0);
              };
              pauseWhenReady();
            }
          };
          if (delay === 0) start();
          else setTimeout(start, delay);
          return requestId;
        };
        const loadingObserver = new MutationObserver(() => {
          const host = readerHost();
          const bar = host?.shadowRoot?.querySelector("[data-reader-loading-bar]");
          if (bar && loadingBarRevealEvents.length === 0) {
            const style = getComputedStyle(bar);
            const rectangle = bar.getBoundingClientRect();
            loadingBarRevealEvents.push({
              height: style.height,
              left: rectangle.left,
              top: rectangle.top,
              width: rectangle.width,
              viewportWidth: innerWidth,
              viewportHeight: innerHeight,
            });
          }
        });
        loadingObserver.observe(document.documentElement, { childList: true, subtree: true });
        document.querySelector("#launch-chrome").addEventListener("click", open);
        return {
          open,
          extract: () => globalThis.Extractor.fromPage(document, globalThis.Defuddle),
          loadingBarRevealEvents,
        };
      }

      async function installMobileViewer() {
        globalThis.browser = {
          runtime: {
            getURL(path) {
              if (globalThis.__READER_WASM_FAILURE && !globalThis.__READER_WASM_RETRY && path.endsWith(".wasm")) {
                return "/missing/reader_session_bg.wasm";
              }
              return `/apps/ios/ReaderExtension/Resources/generated/${path}`;
            },
          },
        };
        for (const source of [
          "/apps/ios/ReaderExtension/Resources/generated/defuddle.js",
          "/apps/ios/ReaderExtension/Resources/generated/session-wasm-module.js",
          "/apps/ios/ReaderExtension/Resources/generated/session.js",
          "/apps/ios/ReaderExtension/Resources/generated/engine.js",
          "/apps/ios/ReaderExtension/Resources/generated/extractor.js",
          "/apps/ios/ReaderExtension/Resources/generated/icons.js",
          "/apps/ios/ReaderExtension/Resources/generated/viewer.js",
          "/apps/ios/ReaderExtension/Resources/generated/bootstrap.js",
        ]) {
          await loadScript(source, source.endsWith("session-wasm-module.js") ? "module" : "text/javascript");
          loadedScripts.push(source);
        }
        const extractFromPage = globalThis.Extractor.fromPage;
        const extract = () => extractFromPage(document, globalThis.Defuddle);
        let mobileErrorOnce = null;
        let mobileFixtureOptions = {};
        const delayedFixtureContent = () => {
          if (mobileErrorOnce) {
            const reason = mobileErrorOnce;
            mobileErrorOnce = null;
            return Promise.reject(new Error(reason));
          }
          const content = typeof mobileFixtureOptions.text === "string"
            ? customFixtureContent(mobileFixtureOptions.text, mobileFixtureOptions.readingContext)
            : fixtureContent({ image: mobileFixtureOptions.image || imageFixture, figureFirst: mobileFixtureOptions.figureFirst || figureFirst, alt: mobileFixtureOptions.alt, caption: mobileFixtureOptions.caption, cacheKey: mobileFixtureOptions.cacheKey, srcset: mobileFixtureOptions.srcset, sizes: mobileFixtureOptions.sizes, imageDelay: mobileFixtureOptions.imageDelay });
          return defaultDelay === 0
            ? content
            : new Promise((resolve) => setTimeout(() => resolve(content), defaultDelay));
        };
        globalThis.Extractor.fromPage = delayedFixtureContent;
        globalThis.Extractor.fromPageAsync = delayedFixtureContent;
        return {
          open: (options = {}) => {
            mobileFixtureOptions = options;
            if (options.error === true) mobileErrorOnce = options.reason || "extraction_failed";
            return globalThis.MobileViewer.open();
          },
          extract,
        };
      }

      globalThis.ReaderE2EReady = (viewer === "mobile" ? installMobileViewer() : installChromeViewer())
        .then((api) => {
          globalThis.ReaderE2E = {
            ...api,
            loadedScripts,
          };
        });
    </script>
  </body>
</html>
