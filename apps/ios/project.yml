name: Reader
options:
  bundleIdPrefix: app.reader
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.1.1
    READER_BUNDLE_ID: app.reader.ios
    READER_EXTENSION_BUNDLE_ID: app.reader.ios.extension
targets:
  Reader:
    type: application
    platform: iOS
    sources:
      - path: ReaderApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(READER_BUNDLE_ID)
        PRODUCT_NAME: Reader
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ReaderApp/Info.plist
    dependencies:
      - target: ReaderExtension
        embed: true
  ReaderExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ReaderExtension
        excludes:
          - Resources
      - path: ReaderExtension/Resources/manifest.json
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/defuddle.js
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/engine.js
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/extractor.js
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/icons.js
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/viewer.js
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/bootstrap.js
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/defuddle-LICENSE.txt
        buildPhase: resources
      - path: ReaderExtension/Resources/generated/lucide-LICENSE.txt
        buildPhase: resources
    preBuildScripts:
      - name: Build web resources
        script: |
          cd "$SRCROOT/../.."
          mise exec -- pnpm run build:ios
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(READER_EXTENSION_BUNDLE_ID)
        PRODUCT_NAME: ReaderExtension
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ReaderExtension/Info.plist
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
schemes:
  Reader:
    build:
      targets:
        Reader: all
        ReaderExtension: all
