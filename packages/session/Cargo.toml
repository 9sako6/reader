[package]
name = "reader-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure ReaderSession state machine shared by the Reader viewers"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = { version = "=0.2.127", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[dev-dependencies]
anyhow = "=1.0.104"
itf = "=0.4.0"
quint-connect = "=0.1.2"

[[test]]
name = "quint_connect"
path = "tests/quint_connect.rs"
